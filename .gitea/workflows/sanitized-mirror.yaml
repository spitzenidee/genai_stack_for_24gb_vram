name: Sanitized Mirror Engine

# IMPORTANT: The branch name below must always match SOURCE_BRANCH in mirror_config.env
on:
  push:
    branches:
      - 'public'
  workflow_dispatch: # Allows manual re-trigger from Gitea UI without a dummy commit

jobs:
  mirror-to-github:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard — verify running on correct source branch
        run: |
          source mirror_config.env
          if [ "${GITHUB_REF_NAME}" != "${SOURCE_BRANCH}" ]; then
            echo "ERROR: Running on '${GITHUB_REF_NAME}' but SOURCE_BRANCH='${SOURCE_BRANCH}'. Aborting to prevent accidental leak."
            exit 1
          fi
          echo "Branch check passed: ${GITHUB_REF_NAME}"

      - name: Sanitize and Push
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          CONFIG_FILE="mirror_config.env"
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "ERROR: $CONFIG_FILE not found. Action aborted."
            exit 1
          fi

          source "$CONFIG_FILE"

          # 1. Sanitation: remove all internal files listed in EXCLUDE_LIST
          echo "Sanitizing workspace..."
          for item in $EXCLUDE_LIST; do
            if [ -e "$item" ]; then
              rm -rf "$item"
              echo "  Removed: $item"
            fi
          done

          # 2. Stage all deletions; commit only if sanitation actually changed something
          git config user.name "Mirror Bot"
          git config user.email "mirror@gitea.local"
          git add -A
          git diff-index --quiet HEAD || git commit -m "chore: sanitized public synchronization"

          # 3. Always push — the workflow trigger guarantees new content exists
          for branch in $DEST_BRANCH; do
            echo "Pushing to GitHub ${TARGET_REPO} → ${branch}..."
            git push --force "https://x-access-token:${GH_TOKEN}@${TARGET_REPO}" HEAD:refs/heads/${branch}
          done
          echo "Done."
