# Grafana dashboard provider — genai_stack
# Drop this file into /etc/grafana/provisioning/dashboards/ on the Grafana LXC.
# Also copy grafana/dashboards/llama-vulkan-amdgpu.json to the path below.
#
# After copying, reload with: systemctl reload grafana-server
# or:  curl -X POST http://admin:admin@localhost:3000/api/admin/provisioning/dashboards/reload

apiVersion: 1

providers:
  - name: genai_stack
    orgId: 1
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/genai_stack
      foldersFromFilesStructure: false
