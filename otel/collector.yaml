# OpenTelemetry Collector — genai_stack observability pipeline
# Receives metrics/logs/traces from all stack services and forwards to Grafana.
# Add new services by appending scrape_configs entries or additional receivers.

receivers:

  # ── Prometheus scrape ────────────────────────────────────────────────────────
  # llama.cpp router mode calls ensure_model() on every /metrics?model=X request,
  # which would trigger model loads when idle (causing VRAM contention + 500 errors).
  #
  # Fix: llama-sd (otel/llama_sd.py) queries /v1/models on each server and returns
  # ONLY models with status.value=="loaded" as targets (Prometheus HTTP SD format).
  # When all models are idle, it returns [] and OTel scrapes nothing — no side effects.
  prometheus:
    config:
      scrape_configs:
        - job_name: llama
          scrape_interval: 15s
          http_sd_configs:
            - url: http://llama-sd:${env:LLAMA_SD_PORT}/targets
              refresh_interval: 15s

        # AMD GPU hardware metrics (temp, VRAM, clocks, power, fan, voltage)
        # Served by the gpu-exporter sidecar — no ROCm, pure sysfs reads.
        - job_name: amdgpu
          scrape_interval: 15s
          static_configs:
            - targets: ['gpu-exporter:${env:GPU_EXPORTER_PORT}']

  # ── Docker container resource metrics (CPU, mem, net, I/O per container) ─────
  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 15s
    timeout: 20s

  # ── Host-level CPU / memory / load ──────────────────────────────────────────
  # Reads /proc from within the container — valid for cpu/mem/load without host mounts
  host_metrics:
    collection_interval: 30s
    scrapers:
      cpu: {}
      memory: {}
      load: {}

  # ── Container logs (Docker JSON log driver) ──────────────────────────────────
  # Requires volume: /var/lib/docker/containers:/var/log/docker:ro
  file_log:
    include:
      - /var/log/docker/*/*-json.log
    include_file_path: true
    include_file_name: false
    start_at: end
    operators:
      - type: json_parser
        id: parse-docker-json
        timestamp:
          parse_from: attributes.time
          layout_type: gotime
          layout: '2006-01-02T15:04:05.999999999Z07:00'
      - type: move
        from: attributes.log
        to: body
      - type: move
        from: attributes.stream
        to: attributes["log.iostream"]
      # Extract container ID from file path for Grafana/Loki filtering
      - type: regex_parser
        id: extract-container-id
        parse_from: attributes["log.file.path"]
        regex: '/var/log/docker/(?P<container_id>[0-9a-f]+)/'
      - type: add
        field: attributes.log.source
        value: docker
      - type: add
        field: resource["service.name"]
        value: docker

  # ── Host syslog files ────────────────────────────────────────────────────────
  # Requires volume: /var/log:/var/log/host:ro
  file_log/host_syslog:
    include:
      - /var/log/host/syslog
      - /var/log/host/auth.log
      - /var/log/host/kern.log
    include_file_path: true
    include_file_name: true
    start_at: end
    operators:
      - type: regex_parser
        id: parse-rsyslog
        regex: '^(?P<timestamp>\S+)\s+(?P<host>\S+)\s+(?P<ident>.+?:)\s+(?P<body>.*)$'
        timestamp:
          parse_from: attributes.timestamp
          layout_type: gotime
          layout: '2006-01-02T15:04:05.999999999Z07:00'
      - type: add
        field: attributes.log.source
        value: host-syslog
      - type: add
        field: resource["service.name"]
        value: host-syslog


  # ── OTLP receiver — services can push traces/metrics/logs here ───────────────
  # open-webui is configured via OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
  # Add any future instrumented service the same way.
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:

  # Guard against memory spikes during log/metric bursts
  memory_limiter:
    check_interval: 5s
    limit_mib: 256
    spike_limit_mib: 64

  # Enrich all signals with hostname and OS info
  resource_detection:
    detectors: [system]
    timeout: 5s
    override: false

  batch:
    timeout: 10s
    send_batch_size: 1000
    send_batch_max_size: 2000

exporters:

  otlp_grpc:
    endpoint: ${env:OTEL_EXPORTER_OTLP_ENDPOINT}
    tls:
      insecure: true
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 2000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 60s
      max_elapsed_time: 300s

service:
  telemetry:
    logs:
      level: warn   # suppress collector self-noise; set to info for debugging

  pipelines:
    metrics:
      receivers: [prometheus, docker_stats, host_metrics]
      processors: [memory_limiter, resource_detection, batch]
      exporters: [otlp_grpc]

    logs:
      receivers: [file_log, file_log/host_syslog]
      processors: [memory_limiter, resource_detection, batch]
      exporters: [otlp_grpc]

    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc]
