# llama.cpp compiler flag benchmark configurations
# Each [section] is a named config. Lines under it are cmake -D flags, one per line.
# The benchmark script joins them into a single CMAKE_ARGS string.
# Blank lines and # comments are ignored by the parser.
# Results are appended as "# result: ..." lines after benchmarking.
#
# Baseline: -march=znver4 -mtune=znver4 is hardcoded in the Dockerfile (Ryzen 7940HS, Zen 4).
# All GGML "disable" configs were tested and showed no meaningful difference (<0.5 t/s noise).
# The only compile-time variable that produced a consistent gain was LTO (+0.7 t/s / ~1.6%).
#
# Archived results (all on granite-4.0-h-tiny-Q4_K_M.gguf, 5 runs each):
#   current                  43.86 t/s  (AVX-512 only, no LTO, no legacy)
#   current_lto              44.34 t/s  (AVX-512 only, LTO)
#   current_legacy           43.98 t/s  (AVX-512 + legacy, no LTO)
#   current_legacy_lto       44.56 t/s  ← best result so far
#   native-only              44.13 t/s  (GGML_NATIVE only, no explicit flags)
#   native_lto               44.44 t/s
#   no-openmp                43.57 t/s  ← OpenMP matters, keep it on
#   legacy-only              44.18 t/s
#   legacy-only_native-off   44.19 t/s
#   minimal                  44.08 t/s  (all flags off, no NATIVE)

[current_legacy_lto]
-DGGML_OPENMP=ON
-DGGML_NATIVE=ON
-DGGML_LTO=ON
-DGGML_SSE42=ON
-DGGML_AVX=ON
-DGGML_AVX2=ON
-DGGML_FMA=ON
-DGGML_F16C=ON
-DGGML_BMI2=ON
-DGGML_AVX512=ON
-DGGML_AVX512_VBMI=ON
-DGGML_AVX512_VNNI=ON
-DGGML_AVX512_BF16=ON

# result: 43.91766302703357,43.86637517519802,43.88536878885711,43.891466490228424,43.80437932110657 → mean: 43.87 t/s
[current_legacy_lto_avxvnni]
# [current_legacy_lto] + GGML_AVX_VNNI=ON
# AVX_VNNI = 256-bit integer VNNI (vpdpbusd VEX); distinct from AVX512_VNNI (512-bit).
# On Zen4, AVX512_VNNI kernels take priority where they exist; AVX_VNNI only fires
# for operations that have a 256-bit VNNI hand-written kernel but no 512-bit equivalent.
# Expected outcome: same as current_legacy_lto if no such kernels exist for Q4_K_M;
# might show a measurable gain for IQ-quant models on a larger benchmark run.
-DGGML_OPENMP=ON
-DGGML_NATIVE=ON
-DGGML_LTO=ON
-DGGML_SSE42=ON
-DGGML_AVX=ON
-DGGML_AVX2=ON
-DGGML_FMA=ON
-DGGML_F16C=ON
-DGGML_BMI2=ON
-DGGML_AVX_VNNI=ON
-DGGML_AVX512=ON
-DGGML_AVX512_VBMI=ON
-DGGML_AVX512_VNNI=ON
-DGGML_AVX512_BF16=ON

# result: 44.041187041422575,44.01582326171638,43.82838672180762,43.87468190855616,43.92314430453491 → mean: 43.94 t/s
