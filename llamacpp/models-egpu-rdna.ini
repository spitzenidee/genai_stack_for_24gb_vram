version = 1

; ── Global defaults inherited by every model ──────────────────────────────────
[*]
cache-type-k = q8_0
cache-type-v = q8_0
flash-attn = auto
parallel = 1
context-shift = true
load-mode = none
timeout = 7200
sleep-idle-seconds = 1800
threads = 4
threads-batch = 7
; Prompt-processing batches (single source of truth — CLI no longer overrides).
; ubatch = physical micro-batch: compute buffer scales with it; 2048 fits the
; 24 GB eGPU comfortably for the 27B models. n_ubatch is clamped to n_batch
; by llama.cpp, so keep ubatch <= batch.
batch-size = 2048
ubatch-size = 2048
n-gpu-layers = 99
jinja = true
repeat-penalty = 1.05
reasoning = on
reasoning-budget = 8192
reasoning-budget-message = Enough thinking, answering now.
cache-reuse = 512
kv-unified = true
spec-type = ngram-mod
spec-ngram-mod-n-match = 40
spec-ngram-mod-n-min = 4
spec-ngram-mod-n-max = 32
spec-draft-n-max = 2
; seed = 3407                    ; fixed seed for reproducibility

; NOTE (2026-10-10): the rdna-boosts binary only supports the adaptive MTP
; controller (block 01) — plain `draft-mtp` fails to load every model. All
; draft entries below therefore use the production spec-draft set from
; [egpu-SWIFT-1.5-Qwen3.8-27B-Q4KM_KVQ4-adaptive] (draft-mtp-adaptive,
; n-max 3, n-min-adaptive 1, p-min 0.4, ngram-mod 0-16).

; ───────────────────────────────────────────────────────────────────────────────
; PRODUCTION CONFIG (rdna-adaptive) — the rdna-boosts adaptive-MTP controller
; (block 01): draft-mtp-adaptive instead of draft-mtp. In adaptive mode
; spec-draft-n-min is unused (warns) — replaced by spec-draft-n-min-adaptive.
; n-max 3 (adaptive range upper bound; LLAMA_SPEC_DRAFT_N_MAX_CLAMP caps at 15,
; purity promised to 7).
;
; CHOSEN AS THE PRODUCTION LLM CONFIG on 2026-10-10 after the r37 A/B sweep
; (scripts/bench-results/20261009-171432-r37, rdna-boosts v16-a55e952b8-r37).
; It ties the best measured decode (58.0 t/s — inside the ~5% run-to-run noise
; floor set by the unchanged vanilla image: ngram-off 58.3 / d2 58.0 / plain-d3
; 57.5) AND carries adaptivity across varying workloads, which a fixed depth
; cannot. The OMP self-diagnostic pass confirmed no host-mapped-embedding
; confound (flat +1.0%), so the numbers stand.
;
; The production + bench set is now just: vanilla + rdna-adaptive. Every other
; Q4KM_KVQ4 A/B variant has been removed from this file and from the bench
; (scripts/bench_egpu_ab.py). Re-test them — or new ones — only when a new
; rdna-boosts release hints at new configs to test.
;
; DROPPED — measured WORSE on r37 (culprit setting in parens):
;   -adaptive-nmax9       57.7 t/s, acc 0.637  (spec-draft-n-max 9: deep draft)
;   -adaptive-nmax9-p6    50.8 t/s, acc 0.494  (pinned depth 6: too deep)
;   -adaptive-nmax9-p9    48.7 t/s, acc 0.375  (pinned depth 9: too deep)
;   -d1                   51.9 t/s, acc 0.844  (spec-draft-n-max 1: too shallow)
;   -pmin07               56.6 t/s, acc 0.827  (spec-draft-p-min 0.7: high floor)
; DROPPED — competitive but NOT chosen for production (fixed depth, no adaptivity):
;   (plain d3, was "rdna")  57.5 t/s, acc 0.653  (draft-mtp n-max 3)
;   -d2                    58.0 t/s, acc 0.737  (draft-mtp n-max 2)
;   -ngram-off             58.3 t/s, acc 0.661  (draft-mtp n-max 3, no ngram-mod)
; Depth map (r37): d1 51.9 -> d2 58.0 (peak) -> d3 57.5 -> p6 50.8 -> p9 48.7.
; ngram-mod contributed nothing on this workload (ngram-off >= plain d3).
[egpu-SWIFT-1.5-Qwen3.8-27B-Q4KM_KVQ4-adaptive]
model = /models/Swift-1.5-Qwen3.8-27B-Q4_K_M.gguf
c = 180000
flash-attn = on
swa-full = false
cache-type-k = q4_0
cache-type-v = q4_0
cache-type-k-draft  = q4_0
cache-type-v-draft  = q4_0
chat-template-file = /models/qwen_chat_template.jinja
# low, medium, xhigh:
chat-template-kwargs = {"preserve_thinking": true, "auto_disable_thinking_with_tools": false, "reasoning_effort":"xhigh"}
reasoning-format = deepseek
temp = 0.6
top-k = 20
top-p = 0.95
min-p = 0
repeat-penalty = 1.0
presence-penalty = 0
reasoning-budget = 20000
spec-type = draft-mtp-adaptive,ngram-mod
spec-draft-n-max = 3
spec-draft-n-min-adaptive = 1
spec-draft-p-min = 0.4
spec-ngram-mod-n-min = 0
spec-ngram-mod-n-max = 16
