version = 1

; ── Global defaults inherited by every model ──────────────────────────────────
[*]
cache-type-k = q8_0
cache-type-v = q8_0
flash-attn = auto
parallel = 1
context-shift = true
load-mode = none
timeout = 7200
sleep-idle-seconds = 1800
threads = 4
threads-batch = 7
; Prompt-processing batches (single source of truth — CLI no longer overrides).
; ubatch = physical micro-batch: compute buffer scales with it; 2048 fits the
; 24 GB eGPU comfortably for the 27B models. n_ubatch is clamped to n_batch
; by llama.cpp, so keep ubatch <= batch.
batch-size = 2048
ubatch-size = 2048
n-gpu-layers = 99
jinja = true
repeat-penalty = 1.05
reasoning = on
reasoning-budget = 8192
reasoning-budget-message = Enough thinking, answering now.
cache-reuse = 512
kv-unified = true
spec-type = ngram-mod
spec-ngram-mod-n-match = 40
spec-ngram-mod-n-min = 4
spec-ngram-mod-n-max = 32
spec-draft-n-max = 2
; seed = 3407                    ; fixed seed for reproducibility

; ───────────────────────────────────────────────────────────────────────────────
[egpu-SWIFT-1.5-Qwen3.8-27B-Q4KM_KVQ4]
model = /models/Swift-1.5-Qwen3.8-27B-Q4_K_M.gguf
c = 180000
flash-attn = on
swa-full = false
cache-type-k = q4_0
cache-type-v = q4_0
cache-type-k-draft  = q4_0
cache-type-v-draft  = q4_0
chat-template-file = /models/qwen_chat_template.jinja
# low, medium, xhigh:
chat-template-kwargs = {"preserve_thinking": true, "auto_disable_thinking_with_tools": false, "reasoning_effort":"xhigh"}
reasoning-format = deepseek
temp = 0.6
top-k = 20
top-p = 0.95
min-p = 0
repeat-penalty = 1.0
presence-penalty = 0
reasoning-budget = 20000
spec-type = draft-mtp,ngram-mod
spec-draft-n-max = 3
spec-draft-n-min = 1
spec-draft-p-min = 0.4
spec-ngram-mod-n-min = 0
spec-ngram-mod-n-max = 16


