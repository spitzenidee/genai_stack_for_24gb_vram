services:

  open-webui:
    profiles: ["llama"]
    depends_on:
      - llamacpp-egpu
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    volumes:
      - ${APP_ROOT}/open-webui:/app/backend/data
    ports:
      - "${OPEN_WEBUI_PORT}:8080"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - 'AIOHTTP_CLIENT_TIMEOUT=7200'
      - 'FORWARDED_ALLOW_IPS=172.16.0.0/12'
      - 'OTEL_SERVICE_NAME=open-webui'
      - 'OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318'
      - 'OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf'
    restart: unless-stopped

  llamacpp-egpu:
    build:
      context: ./llamacpp
      dockerfile: Dockerfile.vulkan
    image: llama-cpp-vulkan:latest
    container_name: llamacpp-egpu
    profiles: ["llama"]
    devices:
      - ${GPU_RENDER_DEVICE}:${GPU_RENDER_DEVICE}
      - ${GPU_CARD_DEVICE}:${GPU_CARD_DEVICE}
    group_add:
      - "${RENDER_GID}"   # render
      - "${VIDEO_GID}"    # video
    volumes:
      - ${APP_ROOT}/llamacpp/hfmodels:/models
      - ${APP_ROOT}/llamacpp/models-egpu.ini:/config/models.ini:ro
    ports:
      - "${LLAMA_EGPU_PORT}:8092"
    shm_size: '256m'
    depends_on:
      - lact
    ulimits:
      memlock:
        soft: -1
        hard: -1
    command: >
      --models-preset /config/models.ini
      --host 0.0.0.0
      --port 8092
      --models-max ${LLAMA_EGPU_MODELS_MAX}
      -cb
      -b ${LLAMA_EGPU_BATCH_SIZE}
      -ub ${LLAMA_EGPU_UBATCH_SIZE}
      --metrics
    restart: unless-stopped

  # Radeon 780M iGPU (Phoenix, gfx1103) — always-on, independent of the
  # eGPU/gromacs/blender work-mode switch (separate hardware, no VRAM
  # contention with the eGPU). Same Vulkan image as llamacpp-egpu: RADV
  # selects the target device at runtime via the bind-mounted render node,
  # no arch-specific build needed. Only serve models whose weights + KV
  # cache fit entirely within the ~16 GB UMA carve-out (see models-igpu.ini).
  llamacpp-igpu:
    build:
      context: ./llamacpp
      dockerfile: Dockerfile.vulkan
    image: llama-cpp-vulkan:latest
    container_name: llamacpp-igpu
    devices:
      - ${GPU_IGPU_RENDER_DEVICE}:${GPU_IGPU_RENDER_DEVICE}
      - ${GPU_IGPU_CARD_DEVICE}:${GPU_IGPU_CARD_DEVICE}
    group_add:
      - "${RENDER_GID}"   # render
      - "${VIDEO_GID}"    # video
    volumes:
      - ${APP_ROOT}/llamacpp/hfmodels:/models
      - ${APP_ROOT}/llamacpp/models-igpu.ini:/config/models.ini:ro
    ports:
      - "${LLAMA_IGPU_PORT}:8093"
    shm_size: '256m'
    depends_on:
      - lact
    ulimits:
      memlock:
        soft: -1
        hard: -1
    command: >
      --models-preset /config/models.ini
      --host 0.0.0.0
      --port 8093
      --models-max ${LLAMA_IGPU_MODELS_MAX}
      -cb
      -b ${LLAMA_IGPU_BATCH_SIZE}
      -ub ${LLAMA_IGPU_UBATCH_SIZE}
      --metrics
    restart: unless-stopped

  # AMD GPU sysfs Prometheus exporter — pure stdlib Python, no ROCm.
  # Reads /sys/class/drm and /sys/class/hwmon from the container's sysfs view
  # (already accessible; no extra mounts needed — containers share the VM kernel's sysfs).
  gpu-exporter:
    image: python:3.13-alpine
    container_name: gpu-exporter
    environment:
      - PORT=${GPU_EXPORTER_PORT}
    volumes:
      - ${APP_ROOT}/otel/amdgpu_exporter.py:/app/amdgpu_exporter.py:ro
    command: python3 /app/amdgpu_exporter.py
    restart: unless-stopped

  # Prometheus HTTP SD: reads /v1/models status from each llama server and returns
  # ONLY currently-loaded models as scrape targets. Prevents spurious model loads
  # that occur when the OTel Collector scrapes /metrics?model=X for unloaded models.
  llama-sd:
    image: python:3.12-alpine
    container_name: llama-sd
    environment:
      - PORT=${LLAMA_SD_PORT}
      - LLAMA_SERVERS=${LLAMA_SERVERS}
    volumes:
      - ${APP_ROOT}/otel/llama_sd.py:/app/llama_sd.py:ro
    command: python3 /app/llama_sd.py
    restart: unless-stopped
    # NOTE: no depends_on on the llama servers — this service must stay
    # profile-free (otel-collector depends on it, and target discovery should
    # keep working in every GPU work mode). get_targets() already catches
    # per-server connection failures and skips them, so a stopped/profile-
    # gated llamacpp-egpu is handled gracefully without a hard dependency
    # that would otherwise force it to start regardless of the active mode.

  otel-collector:
    # NOTE: gpu-exporter omitted from depends_on intentionally — OTel handles
    # a temporarily unavailable scrape target gracefully without blocking startup.
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    environment:
      - LLAMA_SD_PORT=${LLAMA_SD_PORT}
    group_add:
      - "988"   # docker group — required for docker_stats receiver + resourcedetection
    volumes:
      - ${APP_ROOT}/otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - /var/lib/docker/containers:/var/log/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${OTEL_GRPC_PORT}:4317"   # OTLP gRPC — receive push traces from services on this host
      - "${OTEL_HTTP_PORT}:4318"   # OTLP HTTP
    restart: unless-stopped
    depends_on:
      - llama-sd

  lact:
    image: ghcr.io/ilya-zlobintsev/lact:v0.9.0    # official image: daemon + CLI only (no GUI)
    container_name: lact
    privileged: true                              # required: sysfs writes for power/voltage control
    devices:
      - ${GPU_RENDER_DEVICE}:${GPU_RENDER_DEVICE}
      - ${GPU_CARD_DEVICE}:${GPU_CARD_DEVICE}
    volumes:
      - ${APP_ROOT}/lact:/etc/lact                          # config.yaml persists here
    restart: unless-stopped

  comfyui-rocm:
    build:
      context: ./comfyui
      dockerfile: Dockerfile.rocm
    image: comfyui-rocm-gfx1100:latest
    container_name: comfyui-rocm
    profiles: ["comfyui"]
    devices:
      - /dev/kfd:/dev/kfd
      - ${GPU_RENDER_DEVICE}:${GPU_RENDER_DEVICE}
    group_add:
      - "${RENDER_GID}"   # render
      - "${VIDEO_GID}"    # video
    environment:
      # Disable SDMA engine for ROCm memory transfers — reduces IOMMU TLB flush
      # frequency in the VFIO/KVM passthrough context.  Without this, async weight
      # offloading streams trigger amdgpu_tlb_fence_work / svm_range_restore_work
      # workqueue storms on kernel 6.17 that saturate VM vCPUs while the GPU idles.
      - HSA_ENABLE_SDMA=0
    volumes:
      - ${APP_ROOT}/comfyui/models:/ComfyUI/models       # shared with CPU instance — no duplication
      - ${APP_ROOT}/comfyui/output:/ComfyUI/output
      - ${APP_ROOT}/comfyui/input:/ComfyUI/input
      - ${APP_ROOT}/comfyui/custom_nodes:/ComfyUI/custom_nodes
      # Patched built-in scripts — single-file mounts override the image file
      # without shadowing the rest of comfy_extras/
      - ${APP_ROOT}/comfyui/patches/nodes_qwen.py:/ComfyUI/comfy_extras/nodes_qwen.py:ro
    ports:
      - "${COMFYUI_ROCM_PORT}:8188"
    depends_on:
      - lact
    shm_size: '2gb'
    ulimits:
      memlock:
        soft: -1
        hard: -1
    # Override Dockerfile CMD to add performance flags without a rebuild.
    # --use-pytorch-cross-attention : PyTorch SDPA cross-attention kernel.
    # --reserve-vram 2         : keep 2 GB VRAM free for other processes sharing the GPU.
    # --cache-ram              : RAM pressure-based node result caching.
    # --dont-upcast-attention  : keep attention in bf16 throughout, skip fp32 upcast.
    # --async-offload 2        : two-stream async weight offloading.
    # --preview-method latent2rgb : near-zero-cost linear latent preview.
    command: >
      python3 main.py --listen 0.0.0.0 --port 8188
      --use-pytorch-cross-attention --reserve-vram 2 --cache-ram
      --dont-upcast-attention --async-offload 2
      --preview-method latent2rgb
    restart: unless-stopped

  # --- GPU work-mode: GROMACS (profile "gromacs") --------------------------
  # HIP backend build for RDNA3 (gfx1100), GROMACS 2026.3 — full GPU offload
  # (nb + pme + bonded + update). Container idles (sleep infinity); `make
  # gromacs` switches to this mode, then use `docker compose exec gromacs-rocm
  # bash` (or `tmux attach`) for interactive prep/mdrun sessions, e.g.:
  #   gmx mdrun -ntmpi 1 -nb gpu -pme gpu -bonded gpu -update gpu -deffnm run1
  gromacs-rocm:
    build:
      context: ./gromacs
      dockerfile: Dockerfile.rocm
    image: gromacs-hip-gfx1100:latest
    container_name: gromacs-rocm
    profiles: ["gromacs"]
    devices:
      - /dev/kfd:/dev/kfd
      - ${GPU_RENDER_DEVICE}:${GPU_RENDER_DEVICE}
      - ${GPU_CARD_DEVICE}:${GPU_CARD_DEVICE}
    group_add:
      - "${RENDER_GID}"   # render
      - "${VIDEO_GID}"    # video
    volumes:
      - ${GROMACS_PROJECTS_DIR}:/work
    working_dir: /work
    entrypoint: ["sleep", "infinity"]
    restart: unless-stopped

  # --- GPU work-mode: Blender (profile "blender") ---------------------------
  # Headless Blender 5.2 LTS with Cycles/HIP for the eGPU. Container idles;
  # `make blender` switches to this mode, then
  # `docker compose exec blender-rocm blender-render /work/scene.blend -f 1 ...`
  # runs renders interactively. The wrapper forces GPU compute and HIP backend.
  blender-rocm:
    build:
      context: ./blender
      dockerfile: Dockerfile.rocm
    image: blender-rocm-gfx1100:latest
    container_name: blender-rocm
    profiles: ["blender"]
    user: "${UID:-1000}:${GID:-1000}"   # write renders as the host user
    devices:
      - /dev/kfd:/dev/kfd
      - ${GPU_RENDER_DEVICE}:${GPU_RENDER_DEVICE}
      - ${GPU_CARD_DEVICE}:${GPU_CARD_DEVICE}
    group_add:
      - "${RENDER_GID}"   # render
      - "${VIDEO_GID}"    # video
    environment:
      - HSA_ENABLE_SDMA=0
    volumes:
      - ${APP_ROOT}/blender/work:/work
    working_dir: /work
    shm_size: '1gb'
    ulimits:
      memlock:
        soft: -1
        hard: -1
    entrypoint: ["sleep", "infinity"]
    restart: unless-stopped

